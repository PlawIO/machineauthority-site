<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <rect width="512" height="512" fill="#ffffff"/>
  <!-- Square MA pixel icon — scaled from favicon.svg's 120x120 geometry -->
  <g fill="#111111" transform="scale(4.2667)">
    <!-- M (top-left) -->
    <rect x="10" y="10" width="10" height="50"/>
    <rect x="50" y="10" width="10" height="50"/>
    <rect x="20" y="20" width="10" height="10"/>
    <rect x="40" y="20" width="10" height="10"/>
    <rect x="30" y="30" width="10" height="10"/>

    <!-- A (bottom-right) -->
    <rect x="70" y="60" width="30" height="10"/>
    <rect x="60" y="70" width="10" height="40"/>
    <rect x="100" y="70" width="10" height="40"/>
    <rect x="70" y="80" width="30" height="10"/>
  </g>
</svg>
